name: Deploy to Render (build gated by tests)

on:
  release:
    types: [ published ]          # GitHub release
  push:
    tags:     [ 'v*' ]            # any tag that starts with v
    branches:
      - 'main'
      - 'test/software-verification-validation-testing' # Testing purposes

jobs:
  # ---------- 1. TEST JOB ----------
  test-backend:
    runs-on: ubuntu-latest
    name: Maven verify

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Maven verify
        run: mvn -B --fail-at-end verify
        env:
          SPRING_PROFILES_ACTIVE: test

  # ---------- 2. DEPLOY JOB ----------
  deploy:
    needs: test-backend          # only run if tests succeed
    runs-on: ubuntu-latest
    name: Deploy to Render

    steps:
      # 1) Checkout (again – this job has its own workspace)
      - name: Checkout code
        uses: actions/checkout@v4

      # 2) Install Render CLI
      - name: Install Render CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/render-oss/cli/refs/heads/main/bin/install.sh | sh

      # 3) Set Render workspace
      - name: Set Render Workspace
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          render workspace set aiexpensetracker-workspace -o json

      # 4) Capture commit SHA (used by Render)
      - name: Get commit SHA
        id: git-info
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      # 5) Verify CLI
      - name: Render CLI version
        run: render --version

      # 6) Deploy
      - name: Trigger Render Deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          render deploys create ${{ secrets.RENDER_SERVICE_ID }} \
            --commit "$commit" \
            -o json --confirm
